user  root;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


stream {
  server {
    listen 443 ssl;

    ssl_certificate        /data/certs/server-cert.pem;
    ssl_certificate_key    /data/certs/server-key.pem;
    ssl_client_certificate /data/certs/ca-cert.pem;
    ssl_verify_client on;

    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5;
    ssl_session_tickets    off;
    ssl_handshake_timeout  10s;

    # keep idle streams (docker logs -f, attach, exec) open longer than the 10m default
    proxy_timeout 1h;

    proxy_pass unix:/var/run/docker.sock;
  }
}
