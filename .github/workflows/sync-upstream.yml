name: sync-upstream

# Keeps this fork in sync with https://github.com/kekru/docker-remote-api-tls:
# merges upstream/master into master and mirrors new upstream tags.
#
# Pushes made with GITHUB_TOKEN are rejected when upstream changes files under
# .github/workflows. Add a repo secret SYNC_TOKEN (fine-grained PAT with
# "Contents: read/write" and "Workflows: read/write" on this repo) to cover that.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/kekru/docker-remote-api-tls.git
  BRANCH: master

jobs:
  sync:
    # never run in the upstream repo or in other forks
    if: github.repository == 'xorguy/docker-remote-api-tls'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream and mirror tags
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$BRANCH"

          before=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "upstream/$BRANCH" HEAD; then
            echo "master already contains upstream/$BRANCH"
          elif ! git merge --no-edit "upstream/$BRANCH"; then
            git merge --abort
            echo "::error::Merge conflict with upstream/$BRANCH. Resolve locally: git fetch upstream && git merge upstream/$BRANCH"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin "HEAD:$BRANCH"
            echo "master_changed=true" >> "$GITHUB_OUTPUT"
          fi

          origin_tags=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | sort)
          upstream_tags=$(git ls-remote --tags --refs upstream | sed 's#.*refs/tags/##' | sort)
          new_tags=$(comm -13 <(printf '%s\n' "$origin_tags") <(printf '%s\n' "$upstream_tags") | grep -E '^v[0-9]' || true)

          for t in $new_tags; do
            git fetch --no-tags upstream "refs/tags/$t:refs/tags/$t"
            git push origin "refs/tags/$t"
          done
          echo "new_tags=$(echo $new_tags)" >> "$GITHUB_OUTPUT"

      # Images are built and published from the local network host with
      # publish-remote.sh, so no image build is triggered here.
      - name: Summary
        env:
          MASTER_CHANGED: ${{ steps.sync.outputs.master_changed }}
          NEW_TAGS: ${{ steps.sync.outputs.new_tags }}
        run: |
          {
            echo "master updated: ${MASTER_CHANGED:-false}"
            echo "new upstream tags: ${NEW_TAGS:-none}"
            if [ "$MASTER_CHANGED" = "true" ]; then
              echo "Run ./publish-remote.sh to publish a new image."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
